name: Manual C++ Build (multi-OS)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      subproject_path:
        description: 'Путь к C++ подпроекту (относительно корня репо)'
        required: true
        default: 'scrollShooter package/cpp/script'
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Configure CMake
        working-directory: ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }}

      - name: Build
        working-directory: ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}
        run: cmake --build build --config ${{ github.event.inputs.build_type }}

      # Шаг для артефактов на Windows (.exe, .dll, .lib, .exp)
      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-windows-${{ github.event.inputs.build_type }}
          path: |
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.exe
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.dll
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.lib
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.exp
          if-no-files-found: error

      # Шаг для артефактов на Linux (.so, .a и исполняемые бинарники)
      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-linux-${{ github.event.inputs.build_type }}
          path: |
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.so
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.a
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/lib*.so*
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/*
          # Исключаем временные папки систем сборки
          exclude: |
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/CMakeFiles/**
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.ninja
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/CMakeCache.txt
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/cmake_install.cmake
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/Makefile
          if-no-files-found: error

      # Шаг для артефактов на macOS (.dylib, .a и исполняемые файлы)
      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-macos-${{ github.event.inputs.build_type }}
          path: |
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.dylib
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/**/*.a
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/*
          exclude: |
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/CMakeFiles/**
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/CMakeCache.txt
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/cmake_install.cmake
            ${{ github.workspace }}/${{ github.event.inputs.subproject_path }}/build/Makefile
          if-no-files-found: error